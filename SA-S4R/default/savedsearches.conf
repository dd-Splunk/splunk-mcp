# Saved searches for Splunk4Rookies workshop validation and MCP tools.
# SPL should match governed snippets in docs/s4r/SPL-CATALOG.md.

[S4R Geo Failed Purchase Hotspots]
description = Workshop Security & Fraud geo panel: failed-purchase hotspots by country/city/IP plus top cities by overall web activity (iplocation).
search = index=main sourcetype=access_combined action=purchase status>=400 \
| iplocation clientip \
| stats count as failed_purchases values(status) as statuses by Country, City, clientip \
| sort - failed_purchases \
| head 15 \
| eval section="hotspot" \
| table section Country City clientip failed_purchases statuses \
| append [ \
    search index=main sourcetype=access_combined \
    | iplocation clientip \
    | stats count as event_count by Country, City \
    | sort 10 - event_count \
    | eval section="top_activity" \
    | table section Country City event_count \
]
dispatch.earliest_time = -24h
dispatch.latest_time = now
is_scheduled = 0

[S4R Summarize Purchase Health]
description = Workshop Business KPIs: lost revenue (lookup), failed vs successful purchases, top products by lost revenue.
search = index=main sourcetype=access_combined action=purchase status>=400 \
| lookup product_codes product_id \
| stats sum(product_price) as lost_revenue_usd, count as failed_purchases \
| eval section="totals" \
| table section lost_revenue_usd failed_purchases \
| append [ \
    search index=main sourcetype=access_combined action=purchase \
    | eval outcome=if(status<400,"success","failure") \
    | stats count as purchase_count by outcome \
    | eval section="outcome" \
    | table section outcome purchase_count \
] \
| append [ \
    search index=main sourcetype=access_combined action=purchase status>=400 \
    | lookup product_codes product_id \
    | stats sum(product_price) as lost_revenue_usd, count as failed_purchases by product_name, category \
    | sort 5 - lost_revenue_usd \
    | eval section="top_product" \
    | table section product_name category lost_revenue_usd failed_purchases \
]
dispatch.earliest_time = -24h
dispatch.latest_time = now
is_scheduled = 0

[S4R Validate NK Attack Traffic]
description = Workshop validation after enabling NK threat mode. Lists failed purchases from North Korea or 175.45.* IPs; empty results mean no NK signal in the time window.
search = index=main sourcetype=access_combined action=purchase status>=400 \
| iplocation clientip \
| where Country="North Korea" OR match(clientip, "^175\.45\.") \
| stats count as failed_purchases values(useragent) as useragents by Country, City, clientip, status \
| sort - failed_purchases
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_scheduled = 0
