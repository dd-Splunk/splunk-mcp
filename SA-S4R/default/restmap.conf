[script:s4r_workshop_mode]
match = /s4r_workshop_mode
script = s4r_workshop_mode.py
handler = s4r_workshop_mode.WorkshopModeHandler
python.version = python3
requireAuthentication = true
# GET (read mode) is open to any MCP user. POST changes Eventgen config with the
# system token (passSystemAuth), so it needs the dedicated capability.
capability.get = mcp_tool_execute
capability.post = s4r_workshop_control
output_modes = json
scripttype = persist
passSystemAuth = true
passPayload = true
passSession = true
