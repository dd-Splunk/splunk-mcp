[product_codes]
filename = product_codes.csv
case_sensitive_match = false

# Eventgen ignores its `host` setting with the default modinput output, so every event would
# carry host=127.0.0.1. Set the shop's virtual host at index time, only for the S4R samples.
[s4r_set_host]
REGEX = .
DEST_KEY = MetaData:Host
FORMAT = host::www.buttercupenterprises.com
