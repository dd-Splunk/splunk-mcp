# Splunk MCP tool definitions for SA-S4R (Splunk4Rookies).
#
# Workshop API tools are registered at splunk-init via:
#   scripts/register-s4r-mcp-tools.sh  (payload: default/s4r_mcp_tools.json)
#
# Saved-search tools reference governed SPL in default/savedsearches.conf.

[validate_nk_attack_traffic]
description = READ-ONLY: run saved search S4R Validate NK Attack Traffic (NK / 175.45.* failed purchases, last 15m).
savedsearch = S4R Validate NK Attack Traffic

[summarize_purchase_health]
description = READ-ONLY: run saved search S4R Summarize Purchase Health (lost revenue, checkout outcomes, top products; last 24h).
savedsearch = S4R Summarize Purchase Health

[geo_failed_purchases]
description = READ-ONLY: run saved search S4R Geo Failed Purchase Hotspots (failed-purchase geo hotspots + top cities; last 24h).
savedsearch = S4R Geo Failed Purchase Hotspots
