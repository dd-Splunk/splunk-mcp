[access_combined]
SHOULD_LINEMERGE = false
EXTRACT-action = action=(?<action>[^&\s"]+)
EXTRACT-product_id = product_id=(?<product_id>[^&\s"]+)
EXTRACT-uid = uid=(?<uid>[^&\s"]+)
EXTRACT-JSESSIONID = JSESSIONID=(?<JSESSIONID>[^&\s"]+)

# CIM Web mapping (tags.conf tags the events `web`). Constants stand in for the Host header,
# which the Eventgen sample lacks. `action` stays the cart verb (view, purchase, ...): the
# workshop searches depend on it, so Web.action is not CIM-normalized.
FIELDALIAS-cim_src = clientip AS src
FIELDALIAS-cim_http_method = method AS http_method
FIELDALIAS-cim_http_referrer = referer AS http_referrer
FIELDALIAS-cim_http_user_agent = useragent AS http_user_agent useragent AS user_agent
FIELDALIAS-cim_bytes_out = bytes AS bytes_out
EVAL-http_referrer_domain = replace(referer, "^[a-zA-Z]+://([^/:]+).*$", "\1")
EVAL-http_user_agent_length = len(useragent)
EVAL-site = "www.buttercupenterprises.com"
EVAL-dest = "www.buttercupenterprises.com"
EVAL-url_domain = "www.buttercupenterprises.com"
EVAL-url = "http://www.buttercupenterprises.com".uri
EVAL-url_length = len("http://www.buttercupenterprises.com".uri)
EVAL-vendor_product = "Buttercup Enterprises Web Shop"
