# Gitleaks config for splunk-mcp (local PoC). Allow documented placeholders only.
title = "splunk-mcp gitleaks"

[extend]
useDefault = true

# Each allowlist below requires the rule, the path, and the line regex to all match, and
# exists only to keep full-history scans clean.

# Older docs/poc/API_REFERENCE.md showed curl -u with a shell variable expansion, not a
# literal password. The current file uses splunk_curl instead.
[[allowlists]]
description = "Shell-variable admin credentials in a historical API_REFERENCE curl example"
condition = "AND"
targetRules = ["curl-auth-user"]
paths = [
  '''^docs/poc/API_REFERENCE\.md$''',
]
regexTarget = "line"
regexes = [
  '''curl -k -u "admin:\$\{SPLUNK_(ADMIN_)?PASSWORD:\?Set SPLUNK_(ADMIN_)?PASSWORD first\}"''',
]

# The entries below match only lines in files removed from the tree.

# Old update-cursor-config.sh and docs/INSTALLATION.md showed sample curl commands with the
# placeholders admin:PASSWORD and admin:<password>, not real credentials.
[[allowlists]]
description = "Placeholder admin credentials in historical curl examples"
condition = "AND"
targetRules = ["curl-auth-user"]
paths = [
  '''^scripts/update-cursor-config\.sh$''',
  '''^docs/INSTALLATION\.md$''',
]
regexTarget = "line"
regexes = [
  '''curl -(k|skS) -u "?admin:(PASSWORD|<password>)"? ''',
]

# Old docs/INSTALLATION.md sample output printed a truncated token: part of the JOSE header
# followed by "...", with no payload or signature segment, so it cannot authenticate.
[[allowlists]]
description = "Truncated sample token in historical setup output"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^docs/INSTALLATION\.md$''',
]
regexTarget = "line"
regexes = [
  '''^\s*Token: eyJ[A-Za-z0-9_-]+\.\.\.\s*$''',
]
